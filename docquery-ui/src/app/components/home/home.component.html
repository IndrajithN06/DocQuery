<div class="app-shell">
    <header class="topbar">
        <a class="brand" routerLink="/chat" aria-label="DocQuery workspace">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="brand-copy"><strong>DocQuery</strong><small>AI document workspace</small></span>
        </a>
        <div class="topbar-actions">
            <span class="workspace-status"><i></i> Workspace ready</span>
            <button class="logout-button" type="button" (click)="logout()"><span>Sign out</span><span aria-hidden="true">↗</span></button>
        </div>
    </header>
    <main class="content">
        <section class="page-intro">
            <div>
                <span class="eyebrow">YOUR KNOWLEDGE, IN CONTEXT</span>
                <h1>Ask better questions of your documents.</h1>
                <p>Upload a PDF, select a source, and get grounded answers in seconds.</p>
            </div>
            <div class="intro-note"><span aria-hidden="true">✦</span> Private by design</div>
        </section>
        <app-document-upload></app-document-upload>
        <app-chat></app-chat>
    </main>
</div>
