<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your DocQuery account
        </p>

        <form (ngSubmit)="signup()">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
                    required />

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input id="password" type="password" name="password" [(ngModel)]="password"
                    placeholder="Enter your password" required />

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
                    placeholder="Confirm your password" required />

            </div>

            @if (errorMessage) {
            <div class="error-message">
                {{ errorMessage }}
            </div>
            }

            @if (successMessage) {
            <div class="success-message">
                {{ successMessage }}
            </div>
            }

            <button type="submit" [disabled]="loading">

                @if (loading) {
                Creating account...
                } @else {
                Create Account
                }

            </button>

        </form>

        <p class="auth-link">

            Already have an account?

            <a routerLink="/login">
                Login
            </a>

        </p>

    </div>

</div>
