<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your DocQuery account
        </p>

        <form (ngSubmit)="login()">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
                    required />

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input id="password" type="password" name="password" [(ngModel)]="password"
                    placeholder="Enter your password" required />

            </div>

            @if (errorMessage) {
            <div class="error-message">
                {{ errorMessage }}
            </div>
            }

            <button type="submit" [disabled]="loading">

                @if (loading) {
                Logging in...
                } @else {
                Login
                }

            </button>

        </form>

        <p class="auth-link">

            Don't have an account?

            <a routerLink="/signup">
                Create account
            </a>

        </p>

    </div>

</div>
